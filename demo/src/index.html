<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>ngx-query-builder Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive demo and examples for ngx-query-builder — a standalone, signal-based Angular query builder.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var theme = localStorage.getItem('ngx-qb-demo-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
